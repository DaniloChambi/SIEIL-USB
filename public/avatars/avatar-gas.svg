      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow-gas" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

