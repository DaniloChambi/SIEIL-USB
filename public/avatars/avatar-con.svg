<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="bg-con" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="skin-con" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8d8c2"/>
      <stop offset="100%" stop-color="#e0b59b"/>
    </linearGradient>
    <linearGradient id="jacket-con" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A4988"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow-con" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo de estudio formal -->
  <rect width="300" height="360" fill="url(#bg-con)" rx="12"/>
  <circle cx="150" cy="140" r="110" fill="#ffffff" opacity="0.18"/>

  <!-- Pelo trasero si es largo -->
  
  

  <!-- Cuello y hombros base -->
  <path d="M 125 185 L 125 230 Q 150 245 175 230 L 175 185 Z" fill="url(#skin-con)"/>
  <!-- Sombra cuello -->
  <path d="M 125 195 Q 150 215 175 195 Q 150 225 125 195 Z" fill="#e0b59b" opacity="0.6"/>

  <!-- Ropa según profesión -->
  

  

  
    <!-- Blazer formal con blusa ejecutiva -->
    <path d="M 40 360 C 45 280 85 245 125 235 L 175 235 C 215 245 255 280 260 360 Z" fill="url(#jacket-con)"/>
    <polygon points="125,235 175,235 165,360 135,360" fill="#ffffff"/>
    <polygon points="125,235 150,265 120,250" fill="#f8fafc"/>
    <polygon points="175,235 150,265 180,250" fill="#f8fafc"/>
    <path d="M 65 360 L 125 240 L 140 310 L 80 360 Z" fill="#0A4988" filter="url(#shadow-con)"/>
    <path d="M 235 360 L 175 240 L 160 310 L 220 360 Z" fill="#0A4988" filter="url(#shadow-con)"/>
  

  

  

  <!-- Cabeza y rostro -->
  <!-- Orejas -->
  <ellipse cx="94" cy="148" rx="10" ry="16" fill="url(#skin-con)"/>
  <ellipse cx="94" cy="148" rx="6" ry="10" fill="#e0b59b"/>
  <ellipse cx="206" cy="148" rx="10" ry="16" fill="url(#skin-con)"/>
  <ellipse cx="206" cy="148" rx="6" ry="10" fill="#e0b59b"/>

  <!-- Forma del rostro -->
  <path d="M 98 120 C 98 75 202 75 202 120 C 202 165 185 198 150 198 C 115 198 98 165 98 120 Z" fill="url(#skin-con)" filter="url(#shadow-con)"/>

  <!-- Ojos -->
  <ellipse cx="128" cy="142" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="128" cy="142" r="3.8" fill="#331c12"/>
  <circle cx="126.5" cy="140.5" r="1.3" fill="#ffffff"/>

  <ellipse cx="172" cy="142" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="172" cy="142" r="3.8" fill="#331c12"/>
  <circle cx="170.5" cy="140.5" r="1.3" fill="#ffffff"/>

  <!-- Cejas -->
  <path d="M 118 132 Q 128 128 138 131" stroke="#171717" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 162 131 Q 172 128 182 132" stroke="#171717" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Nariz sutil -->
  <path d="M 150 142 L 148 158 Q 150 162 154 160" stroke="#e0b59b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Sonrisa profesional -->
  <path d="M 136 172 Q 150 183 164 172" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 140 173 Q 150 178 160 173" stroke="#ffffff" stroke-width="2" fill="none"/>

  <!-- Gafas si aplica -->
  
    <!-- Marco de gafas moderno -->
    <rect x="114" y="133" width="28" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <rect x="158" y="133" width="28" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="142" y1="140" x2="158" y2="140" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="98" y1="138" x2="114" y2="138" stroke="#0f172a" stroke-width="2"/>
    <line x1="186" y1="138" x2="202" y2="138" stroke="#0f172a" stroke-width="2"/>
  

  <!-- Cabello frontal superior -->
  

  

  

  

  
    <!-- Peinado recogido formal femenino -->
    <path d="M 95 115 C 95 62 130 52 155 52 C 180 52 205 65 205 115 C 190 85 170 82 150 82 C 130 82 110 88 95 115 Z" fill="#171717"/>
