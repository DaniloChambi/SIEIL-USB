<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="bg-psm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="skin-psm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#edd2ba"/>
      <stop offset="100%" stop-color="#d2ab8c"/>
    </linearGradient>
    <linearGradient id="jacket-psm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow-psm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Fondo de estudio formal -->
  <rect width="300" height="360" fill="url(#bg-psm)" rx="12"/>
  <circle cx="150" cy="140" r="110" fill="#ffffff" opacity="0.18"/>

  <!-- Pelo trasero si es largo -->
  
  

